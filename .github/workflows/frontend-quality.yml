name: Frontend quality gate
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  build-and-unit-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Typecheck and production build
        run: npm run build
      - name: Unit tests
        run: npm test
