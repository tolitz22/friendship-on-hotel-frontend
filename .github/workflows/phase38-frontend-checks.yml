name: Frontend quality checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      # A package-lock.json is not yet committed to this repo.
      # Do not use npm ci until a verified lockfile is added.
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: TypeScript
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Production build
        run: npm run build
      - name: Install Chromium for mock browser tests
        run: npx playwright install --with-deps chromium
      - name: Desktop and mobile preview smoke
        run: npm run test:e2e
      - name: Attach mock browser failure reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: phase42-mock-ui-failures
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: ignore
